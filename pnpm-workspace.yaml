packages:
  - 'apps/*'
  - 'packages/*'

# Allow these packages to run install/build scripts (Prisma generates its query
# engine; esbuild builds its native binary). pnpm blocks build scripts by default.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true

# better-call@1.4.0 declares a dependency on @better-auth/utils@^0.5.0, which is
# not published (latest is 0.4.2) — it breaks a clean install of better-auth.
# Pin better-call to 1.3.0, which requires @better-auth/utils@^0.3.1 (published).
overrides:
  better-call: '1.3.0'
